name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: redis
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Node dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Install Playwright browsers
        run: vendor/bin/playwright-install --with-deps

      - name: Run tests
        run: php bin/phpunit
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
